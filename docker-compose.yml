# Ponte REST -> RabbitMQ -> Kafka entre intokafka e intorabbit.
#
#   docker compose up --build
#
# Todos os containers ficam na rede "integracao" e se comunicam pelos nomes dos serviços
# (postgres:5432, rabbitmq:5672, kafka:9092). As portas publicadas no host servem apenas
# para acesso externo (cURL, psql, Management UI, ferramentas Kafka).
# Os valores padrão podem ser sobrescritos por variáveis de ambiente ou por um arquivo .env.

name: kafkaandrabbit

x-app-environment: &app-environment
  TZ: ${TZ:-America/Sao_Paulo}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USERNAME: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: ${RABBITMQ_USER:-integracao}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-integracao}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

services:

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # 5433 no host evita conflito com um PostgreSQL local; entre containers continua postgres:5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Só fica saudável depois que o script de init criou os dois bancos e o TCP está aceitando conexões.
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d intokafka -c 'SELECT 1' && psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d intorabbit -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - integracao

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-integracao}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-integracao}
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - integracao

  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    hostname: kafka
    environment:
      # Nó único em modo KRaft (broker + controller, sem ZooKeeper).
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # PLAINTEXT (kafka:9092) para os containers; PLAINTEXT_HOST (localhost:29092) para o host.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - integracao

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: integracao
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - integracao

  intorabbit:
    build:
      context: ./intorabbit/intorabbit
      additional_contexts:
        extra-certs: ./docker/certs
    image: kafkaandrabbit/intorabbit:latest
    container_name: intorabbit
    environment:
      <<: *app-environment
      SERVER_PORT: 8081
      DB_NAME: intorabbit
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: on-failure
    networks:
      - integracao

  intokafka:
    build:
      context: ./intokafka/intokafka
      additional_contexts:
        extra-certs: ./docker/certs
    image: kafkaandrabbit/intokafka:latest
    container_name: intokafka
    environment:
      <<: *app-environment
      SERVER_PORT: 8080
      DB_NAME: intokafka
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # O endpoint só fica disponível quando o restante da ponte já está consumindo.
      intorabbit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: on-failure
    networks:
      - integracao

networks:
  integracao:
    name: integracao
    driver: bridge

volumes:
  postgres-data:
